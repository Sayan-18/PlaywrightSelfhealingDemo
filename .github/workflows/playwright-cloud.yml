name: Playwright Self-Healing Cloud POC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: playwright-self-healing:latest
          build-args: |
            PW_VERSION=v1.61.1-jammy

      - name: Run Self-Healing Playwright Tests in Container
        run: |
          # 1. Create the container without starting it immediately
          CONTAINER_ID=$(docker create \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            playwright-self-healing:latest \
            npx playwright test tests/selfHealingTest.spec.ts)

          # 2. Start the container and wait for the tests to finish
          docker start -a $CONTAINER_ID

          # 3. Copy the Playwright HTML report out of the container to the host runner
          docker cp $CONTAINER_ID:/app/playwright-report ./playwright-report

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report