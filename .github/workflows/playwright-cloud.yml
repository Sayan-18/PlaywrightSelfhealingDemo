name: Playwright Self-Healing Cloud POC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test-gcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit & Build Docker Image via Cloud Build
        run: |
          gcloud builds submit --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/playwright-repo/playwright-self-healing:latest .

      - name: Execute Self-Healing Tests on Cloud Run Job
        run: |
          # If the job doesn't exist yet, create it; otherwise update and execute it
          gcloud run jobs update playwright-healing-job \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/playwright-repo/playwright-self-healing:latest \
            --region=us-central1 \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest" 2>/dev/null || \
          gcloud run jobs create playwright-healing-job \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/playwright-repo/playwright-self-healing:latest \
            --region=us-central1 \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest"

          # Run the job and wait for completion
          gcloud run jobs execute playwright-healing-job --region=us-central1 --wait