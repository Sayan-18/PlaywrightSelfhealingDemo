name: Playwright Self-Healing Cloud POC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-and-test-gcp:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK (gcloud)
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Secret Manager API & IAM Access
        run: |
          # Enable Secret Manager API
          gcloud services enable secretmanager.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}
          
          # Fetch Project Number dynamically
          PROJECT_NUM=$(gcloud projects describe ${{ secrets.GCP_PROJECT_ID }} --format="value(projectNumber)")
          
          # Automatically assign Secret Accessor role to the Compute Service Account
          gcloud projects add-iam-policy-binding ${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${PROJECT_NUM}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" || true

      - name: Submit & Build Docker Image via Cloud Build
        run: |
          gcloud builds submit --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/playwright-repo/playwright-self-healing:latest .

      - name: Deploy and Execute Self-Healing Tests on Cloud Run Job
        run: |
          gcloud run jobs deploy playwright-healing-job \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/playwright-repo/playwright-self-healing:latest \
            --region=us-central1 \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest" \
            --task-timeout=10m \
            --memory=2Gi \
            --cpu=2

          gcloud run jobs execute playwright-healing-job --region=us-central1 --wait