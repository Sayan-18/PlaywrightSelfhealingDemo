name: Playwright Self-Healing Cloud POC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout your code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (for building the container)
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      # 3. Build the Playwright Docker image using your exact version argument
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: playwright-self-healing:latest
          build-args: |
            PW_VERSION=v1.61.1-jammy

      # 4. Run the Docker container, injecting the GitHub Secret as an environment variable
      - name: Run Self-Healing Playwright Tests in Container
        run: |
          docker run --rm \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            playwright-self-healing:latest \
            npx playwright test tests/selfHealingTest.spec.ts

      # 5. Upload test reports as artifacts (Recruiters love seeing test result reports!)
      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7